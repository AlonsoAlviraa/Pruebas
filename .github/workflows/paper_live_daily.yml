# Free multi-strategy paper cloud — runs on GitHub (no local PC required).
# Virtual capital only. Results committed to reports/paper_cloud/ for daily study.
name: paper-live-cloud-daily

on:
  schedule:
    # ~21:30 UTC weekdays ≈ after US cash close
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      synthetic:
        description: "Force synthetic data (1/0)"
        required: false
        default: "0"
      keep_ledgers:
        description: "Keep sqlite ledgers (1/0, larger git)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  paper-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 10-strategy paper cloud batch (REAL market data)
        env:
          TRAD_PAPER_ONLY: "1"
          TRAD_TRADING_MODE: paper
        run: |
          set -e
          SYNTH_FLAG=""
          if [ "${{ github.event.inputs.synthetic }}" = "1" ]; then
            SYNTH_FLAG="--synthetic"
            echo "WARNING: synthetic mode requested — not real market data"
          fi
          python scripts/run_paper_cloud_batch.py \
            --out reports/paper_cloud \
            $SYNTH_FLAG \
            $( [ "${{ github.event.inputs.keep_ledgers }}" = "1" ] && echo --keep-ledgers || true )
          # Hard gate: refuse silent synthetic study packs
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("reports/paper_cloud/latest/summary.json")
          if not p.is_file():
              print("FAIL: missing latest/summary.json"); sys.exit(1)
          d = json.loads(p.read_text(encoding="utf-8"))
          src = d.get("data_sources") or {}
          bad = {k: v for k, v in src.items() if str(v).startswith("synthetic") or v == "missing"}
          print("data_sources=", src)
          if bad and "${{ github.event.inputs.synthetic }}" != "1":
              print("FAIL: non-real sources:", bad); sys.exit(2)
          kills = sum(1 for s in d.get("strategies") or [] if s.get("hard_kill"))
          print(f"hard_kill_count={kills}/{len(d.get('strategies') or [])}")
          print("REAL_DATA_GATE_OK")
          PY

      - name: Commit results to repo
        run: |
          git config user.name "paper-cloud-bot"
          git config user.email "paper-cloud-bot@users.noreply.github.com"
          # Force-add: parent /reports/* is gitignored; paper_cloud is the exception
          git add -f reports/paper_cloud || true
          git reset reports/paper_cloud/data_cache 2>/dev/null || true
          # Drop any sqlite/audit bulk if present
          find reports/paper_cloud -name 'paper_year.db' -delete 2>/dev/null || true
          find reports/paper_cloud -type d -name 'audit' -exec rm -rf {} + 2>/dev/null || true
          git add -f reports/paper_cloud || true
          if git diff --staged --quiet; then
            echo "No paper cloud changes to commit"
            ls -la reports/paper_cloud/latest || true
            git check-ignore -v reports/paper_cloud/latest/SUMMARY.md || true
          else
            git commit -m "paper-cloud: daily multi-strategy study pack [skip ci]"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-cloud-latest
          path: |
            reports/paper_cloud/latest/**
            reports/paper_cloud/history/**
          if-no-files-found: warn
          retention-days: 30
