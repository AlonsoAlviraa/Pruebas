# Free multi-strategy paper cloud — runs on GitHub (no local PC required).
# Virtual capital only. Results committed to reports/paper_cloud/ for daily study.
name: paper-live-cloud-daily

on:
  schedule:
    # ~21:30 UTC weekdays ≈ after US cash close
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      synthetic:
        description: "Force synthetic data (1/0)"
        required: false
        default: "0"
      keep_ledgers:
        description: "Keep sqlite ledgers (1/0, larger git)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  paper-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 10-strategy paper cloud batch
        env:
          TRAD_PAPER_ONLY: "1"
          TRAD_TRADING_MODE: paper
        run: |
          SYNTH_FLAG=""
          if [ "${{ github.event.inputs.synthetic }}" = "1" ]; then
            SYNTH_FLAG="--synthetic"
          fi
          # First runs / network blocks: also try synthetic fallback inside script
          python scripts/run_paper_cloud_batch.py \
            --out reports/paper_cloud \
            $SYNTH_FLAG \
            $( [ "${{ github.event.inputs.keep_ledgers }}" = "1" ] && echo --keep-ledgers || true )

      - name: Fallback synthetic if no summary
        if: always()
        env:
          TRAD_PAPER_ONLY: "1"
        run: |
          if [ ! -f reports/paper_cloud/latest/SUMMARY.md ]; then
            echo "Primary batch missing summary — synthetic fallback"
            python scripts/run_paper_cloud_batch.py --out reports/paper_cloud --synthetic
          fi

      - name: Commit results to repo
        run: |
          git config user.name "paper-cloud-bot"
          git config user.email "paper-cloud-bot@users.noreply.github.com"
          git add reports/paper_cloud || true
          # ignore bulky caches if any slipped in
          git reset reports/paper_cloud/data_cache 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No paper cloud changes to commit"
          else
            git commit -m "paper-cloud: daily multi-strategy study pack [skip ci]"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-cloud-latest
          path: |
            reports/paper_cloud/latest/**
            reports/paper_cloud/history/**
          if-no-files-found: warn
          retention-days: 30
